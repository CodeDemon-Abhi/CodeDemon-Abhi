version: '3.9'

services:
  api:
    build: ./services/api
    ports:
      - "4000:4000"
    environment:
      - AI_SERVICE_URL=http://ai:8000
      - PORT=4000
      - NODE_ENV=development
    depends_on:
      - ai
    volumes:
      - ./services/api:/usr/src/app
      - /usr/src/app/node_modules

  ai:
    build: ./services/ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/ai:/app

